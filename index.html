    <style>
        /* RESET & BASE */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: Impact, system-ui, 'Arial Black', sans-serif;
            background-color: #000000;
            color: #ffffff;
            line-height: 1.3;
            letter-spacing: 0.02em;
            max-width: none;
            overflow-x: hidden;
            padding: 0;
            margin: 0;
        }

        /* TYPOGRAPHY */
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-weight: 900;
            text-transform: uppercase;
            color: #ffffff;
        }

        h1 {
            font-size: clamp(3.8rem, 12vw, 7rem);
            line-height: 0.85;
            margin-bottom: 0.2em;
            letter-spacing: -0.04em;
        }

        h2 {
            font-size: clamp(2.8rem, 8vw, 5rem);
            line-height: 0.9;
            margin-bottom: 0.3em;
        }

        h3 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            line-height: 1;
            margin-bottom: 0.4em;
        }

        p {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: #cccccc;
            max-width: 70ch;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        a {
            color: #ff3b00;
            text-decoration: underline wavy 2px;
            transition: all 0.15s ease;
        }

        a:hover {
            color: #ffffff;
            background-color: #ff3b00;
            text-decoration: none;
        }

        /* BRUTALIST HELPERS */
        .brutal-border {
            border: 4px solid #ffffff;
            box-shadow: 6px 6px 0 #ff3b00;
        }

        .brutal-border-accent {
            border: 4px solid #ff3b00;
            box-shadow: 8px 8px 0 #ffffff;
        }

        .skew-left {
            transform: rotate(-2deg);
        }

        .skew-right {
            transform: rotate(1.5deg);
        }

        .oversized {
            font-size: clamp(5rem, 15vw, 10rem);
            line-height: 0.8;
        }

        .text-accent {
            color: #ff3b00;
        }

        .bg-accent {
            background-color: #ff3b00;
            color: #000000;
        }

        .full-bleed {
            width: 100vw;
            margin-left: calc(-50vw + 50%);
        }

        /* LAYOUT */
        .container {
            padding: 72px 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .container.full-bleed {
            max-width: none;
            padding-left: 72px;
            padding-right: 72px;
        }

        section {
            margin-bottom: 120px;
        }

        .grid-asymmetric {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 48px;
            align-items: start;
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 48px;
        }

        /* HEADER & NAV */
        header {
            padding: 24px 72px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #ff3b00;
            background: #000000;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: -0.03em;
            line-height: 1;
        }

        .logo span {
            color: #ff3b00;
            display: inline-block;
            transform: rotate(-3deg);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        nav a {
            font-family: Impact, system-ui, sans-serif;
            font-size: 1.3rem;
            text-transform: uppercase;
            color: #ffffff;
            text-decoration: none;
            border-bottom: 3px solid transparent;
            padding-bottom: 4px;
            font-weight: 700;
        }

        nav a:hover {
            border-bottom-color: #ff3b00;
            background: transparent;
            color: #ff3b00;
        }

        /* Hamburger (checked hack) */
        .hamburger-checkbox {
            display: none;
        }

        .hamburger-label {
            display: none;
            cursor: pointer;
            padding: 8px 4px;
            border: 3px solid #ffffff;
            background: #000;
            color: #fff;
            font-size: 1.8rem;
            line-height: 1;
            user-select: none;
        }

        .hamburger-label:hover {
            background: #ff3b00;
            border-color: #ff3b00;
            color: #000;
        }

        /* HERO */
        .hero {
            padding: 72px 72px 120px;
            background: #000000;
            position: relative;
            overflow: hidden;
            min-height: 90vh;
            display: flex;
            align-items: center;
            border-bottom: 6px solid #ff3b00;
        }

        .hero::before {
            content: '✖ ✖ ✖ ✖ ✖';
            position: absolute;
            top: -20px;
            right: -40px;
            font-size: 12rem;
            color: rgba(255, 59, 0, 0.08);
            font-weight: 900;
            line-height: 1;
            transform: rotate(12deg);
            pointer-events: none;
            letter-spacing: -0.05em;
            white-space: nowrap;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 900px;
        }

        .hero-content h1 {
            margin-bottom: 16px;
            text-shadow: 8px 8px 0 #ff3b00;
        }

        .hero-content .subhead {
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #ff3b00;
            border-left: 8px solid #fff;
            padding-left: 24px;
            margin-bottom: 32px;
            transform: skewX(-5deg);
        }

        .hero-cta {
            display: inline-block;
            background: #ff3b00;
            color: #000000;
            padding: 18px 48px;
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            text-decoration: none;
            border: 4px solid #ffffff;
            box-shadow: 8px 8px 0 #ffffff;
            transition: 0.1s linear;
            transform: rotate(-1deg);
        }

        .hero-cta:hover {
            transform: rotate(0deg) scale(1.02);
            background: #ffffff;
            color: #000000;
            border-color: #ff3b00;
            box-shadow: 8px 8px 0 #ff3b00;
        }

        /* FEATURES SECTION */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 48px;
            padding: 72px 0;
        }

        .feature-block {
            border: 4px solid #ffffff;
            padding: 48px 32px;
            background: #0a0a0a;
            transform: rotate(var(--rot, 0deg));
            transition: transform 0.2s;
        }

        .feature-block:nth-child(odd) {
            --rot: -1.5deg;
        }
        .feature-block:nth-child(even) {
            --rot: 1.2deg;
        }

        .feature-block:hover {
            transform: rotate(0deg) scale(1.01);
            border-color: #ff3b00;
        }

        .feature-block .emoji-icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 24px;
            filter: grayscale(1) contrast(2);
        }

        .feature-block h3 {
            font-size: 2rem;
            margin-bottom: 16px;
        }

        .feature-block p {
            font-size: 1rem;
            color: #bbbbbb;
        }

        /* REVIEWS */
        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 48px;
        }

        .review-card {
            background: #0a0a0a;
            border: 4px solid #ffffff;
            padding: 40px 32px;
            position: relative;
            transform: rotate(var(--r, 0deg));
            transition: 0.15s;
        }

        .review-card:nth-child(1) {
            --r: -1.8deg;
        }
        .review-card:nth-child(2) {
            --r: 1.4deg;
        }
        .review-card:nth-child(3) {
            --r: -1.1deg;
        }
        .review-card:nth-child(4) {
            --r: 2deg;
        }

        .review-card:hover {
            transform: rotate(0deg) scale(1.02);
            border-color: #ff3b00;
        }

        .review-stars {
            font-size: 1.8rem;
            letter-spacing: 4px;
            margin-bottom: 12px;
            color: #ff3b00;
        }

        .review-text {
            font-family: system-ui, sans-serif;
            font-size: 1.1rem;
            line-height: 1.5;
            color: #dddddd;
            margin-bottom: 24px;
        }

        .review-author {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            border-top: 2px solid #333;
            padding-top: 16px;
        }

        .review-date {
            font-weight: 400;
            color: #888;
        }

        /* ABOUT / RAW TEXTURE */
        .about-block {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 72px;
            align-items: center;
            border-top: 6px solid #ff3b00;
            border-bottom: 6px solid #ff3b00;
            padding: 72px 0;
        }

        .about-block .left {
            transform: skewY(-2deg);
        }

        .about-block .right {
            background: repeating-linear-gradient(45deg, #1a1a1a, #1a1a1a 8px, #000000 8px, #000000 16px);
            padding: 48px;
            border: 4px solid #ff3b00;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* CONTACT */
        .contact-block {
            background: #0a0a0a;
            border: 4px solid #ffffff;
            padding: 72px;
            text-align: center;
            transform: rotate(-0.5deg);
        }

        .contact-block .phone {
            font-size: 4rem;
            font-weight: 900;
            color: #ff3b00;
            text-decoration: none;
            border-bottom: 6px solid #fff;
            display: inline-block;
            padding-bottom: 8px;
        }

        .contact-block .phone:hover {
            background: #ff3b00;
            color: #000;
            border-bottom-color: #000;
        }

        /* FOOTER */
        footer {
            border-top: 4px solid #ffffff;
            padding: 48px 72px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
            background: #000;
        }

        footer p {
            margin: 0;
            font-size: 0.9rem;
            color: #888;
        }

        footer a {
            color: #ff3b00;
            text-decoration: underline;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .container {
                padding: 48px 16px;
            }

            header {
                padding: 16px 24px;
                flex-wrap: wrap;
            }

            .hamburger-label {
                display: inline-block;
            }

            nav {
                display: none;
                width: 100%;
                flex-direction: column;
                gap: 12px;
                padding: 24px 0 12px;
                border-top: 3px solid #ff3b00;
                margin-top: 12px;
            }

            .hamburger-checkbox:checked~nav {
                display: flex;
            }

            .hero {
                padding: 48px 24px 80px;
                min-height: 70vh;
            }

            .hero-content h1 {
                font-size: 3.2rem;
                text-shadow: 4px 4px 0 #ff3b00;
            }

            .hero-content .subhead {
                font-size: 1.4rem;
                padding-left: 16px;
            }

            .hero-cta {
                font-size: 1.3rem;
                padding: 14px 32px;
            }

            .grid-asymmetric {
                grid-template-columns: 1fr;
                gap: 48px;
            }

            .about-block {
                grid-template-columns: 1fr;
                gap: 32px;
                padding: 48px 0;
            }

            .about-block .left {
                transform: none;
            }

            .contact-block {
                padding: 48px 24px;
            }

            .contact-block .phone {
                font-size: 2.6rem;
            }

            footer {
                flex-direction: column;
                text-align: center;
                padding: 32px 24px;
            }

            .container.full-bleed {
                padding-left: 24px;
                padding-right: 24px;
            }

            .features {
                grid-template-columns: 1fr;
                gap: 32px;
            }

            .reviews-grid {
                grid-template-columns: 1fr;
                gap: 32px;
            }

            section {
                margin-bottom: 80px;
            }

            .feature-block,
            .review-card {
                transform: none !important;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2.8rem;
            }
            h2 {
                font-size: 2.2rem;
            }
            .oversized
</body>
